name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v0.3.0)'
        required: true
        type: string
  repository_dispatch:
    types: [release-tag]

concurrency:
  group: build-${{ github.event.inputs.version || github.event.client_payload.tag }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PRIVATE_REPO: Tishtrya/everclaw
  BUILD_REF: ${{ github.event.inputs.version || github.event.client_payload.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            build_cmd: npm run package:desktop:win
            artifact_name: everclaw-win-x64-setup
          - os: macos-latest
            platform: mac
            arch: x64
            build_cmd: npm run package:desktop:mac -- --x64
            artifact_name: everclaw-mac-x64
          - os: macos-latest
            platform: mac
            arch: arm64
            build_cmd: npm run package:desktop:mac -- --arm64
            artifact_name: everclaw-mac-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.EVERCLAW_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.EVERCLAW_REPO_TOKEN }}
          LITE_MODE: 'true'
          
      - name: Upload artifact (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/Everclaw Setup *.exe
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/Everclaw-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate checksums
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            checksums.txt
